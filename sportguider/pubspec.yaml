name: sportguider
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.4 
  firebase_core: ^4.2.1
  firebase_database: ^12.1.4
  email_validator: ^2.1.17
  equatable: ^2.0.8
  google_fonts: ^6.1.0
  yandex_mapkit: ^4.2.1
  auto_route: ^11.0.0 
  salomon_bottom_bar: ^3.1.0
  permission_handler: ^12.0.1
  toggle_switch: ^2.3.0
  flutter_bloc: ^9.1.1
  google_sign_in: ^6.0.0
  flutter_cache_manager: ^3.4.1
  meta: ^1.8.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_svg: ^2.2.3
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/png/
    - assets/images/svg/
